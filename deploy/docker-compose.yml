# bili2go 自托管分析栈：两服务组合，单机一键起。
#
# - bili2go：serve —— 下载 + 容器内 whisper.cpp 转写 + 编排，暴露 /api/analyze、/api/info、/download。
# - summarizer：LLM/回退摘要服务（digest.json -> 五节 summary.md）。
#
# 转写改用容器内 whisper.cpp（不再依赖 macOS video-digest）；whisper 模型不进镜像，挂 ./models 卷。
#
# 用法：
#   mkdir -p models && curl -L -o models/ggml-small.bin \
#     https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
#   cd deploy && docker compose up -d --build
#   curl -X POST 'http://127.0.0.1:8090/api/analyze?bvid={BVID}'
#   # 接真实 LLM：    OPENAI_BASE_URL=... OPENAI_API_KEY=... docker compose up -d --build
#   # 摘要鉴权：      SUMMARIZER_TOKEN=$(openssl rand -hex 32) docker compose up -d --build
#   # 高清需登录态：  BILI_SESSDATA=... docker compose up -d --build
services:
  summarizer:
    build:
      context: ..
      dockerfile: deploy/summarizer/Dockerfile
    image: bili2go-summarizer:latest
    ports:
      - "8091:8091"
    environment:
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      SUMMARY_TOP: "${SUMMARY_TOP:-25}"
      SUMMARIZER_TOKEN: "${SUMMARIZER_TOKEN:-}"
    restart: unless-stopped
  bili2go:
    build:
      context: ..
      dockerfile: deploy/bili2go/Dockerfile
    image: bili2go:latest
    ports:
      - "8090:8090"
    environment:
      BILI_SUMMARIZER_URL: "http://summarizer:8091"
      BILI_SUMMARIZER_TOKEN: "${SUMMARIZER_TOKEN:-}"
      WHISPER_MODEL: "/models/ggml-small.bin"
      BILI_SESSDATA: "${BILI_SESSDATA:-}"
    volumes:
      - ./models:/models:ro
    depends_on:
      - summarizer
    restart: unless-stopped
